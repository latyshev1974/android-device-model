name: Android CI/CD
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Этот шаг автоматически скачает правильную и современную версию Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Теперь мы собираем проект встроенной командой gradle без генерации обертки вручную
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
