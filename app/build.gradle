plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.example.myapplicationnativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapplicationnativeapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Включаем поддержку всех типов процессоров, чтобы приложение работало и на телефонах (ARM), и на ПК (x86)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    compileOptions { 
        sourceCompatibility JavaVersion.VERSION_17 
        targetCompatibility JavaVersion.VERSION_17 
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
