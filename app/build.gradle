plugins { 
    id 'com.android.application' 
}

android {
    namespace 'com.example.myapplicationnativeapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myapplicationnativeapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

dependencies {
    // Используем только базовую библиотеку Android
    implementation 'androidx.annotation:annotation:1.7.1'
}

