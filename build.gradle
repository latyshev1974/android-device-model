buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Обновляем плагин сборки Android до версии, совместимой с новым Gradle
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
